---
---
<html lang="en">
    <head>
        <link rel="shortcut icon" href="/global/favicon.ico" type="image/x-icon">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="stylesheet" href="/global/style.css">
        <link rel="stylesheet" href="page.css">
        <title>App Sales - 256 Arts</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
        <meta name="og:image" content="/global/opengraph.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="keywords" content="256 Arts, iOS, iPadOS, macOS, app store, app store connect, sales, downloads, widget, analytics, app, iphone, ipad, mac">
        <meta name="description" content="App Sales lets you view your app's sales analytics from App Store Connect through a variety of widgets.">
        <meta name="apple-itunes-app" content="app-id=6471903677">

        <script async src="https://www.googletagmanager.com/gtag/js?id=G-JRJ540QVW4"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-JRJ540QVW4');
        </script>
        <script defer src="/global/menu.js"></script>
    </head>
    <body ontouchstart>
        {% include header.html %}
        <section class="banner"></section>
        <section class="app-info">
        	<section>
        		<img src="/apps/icon_appsales.webp" srcset="icon_appsales.webp 2x" class="large-app-icon">
				<h1 id="title">App Sales</h1>
				<h3>App Analytics Widgets</h3>
				<p>View your app's sales analytics from App Store Connect through a variety of widgets</p>
			</section>
			<section class="actions">
				<div>
					<a class="button filled app-buy secondary" href="https://github.com/256Arts/App-Sales" target="_blank">GitHub</a>
				</div>
				<div>
					<a class="store-badge" href="https://apps.apple.com/app/app-sales/id6471903677" target="_blank">
						<img src="/global/app-store-badge.svg" width="124" height="40" alt="Download on the App Store">
					</a>
					<p class="tag">iOS, iPadOS, macOS, visionOS</p>
				</div>
			</section>
        </section>
		<section class="feature">
			<section>
				<div class="phone z-stack">
					<img class="screenshot" srcset="shot1.webp 2x" alt="screenshot" loading="lazy">
					<img class="device-frame" srcset="/phone.png 2x" alt="phone frame" loading="lazy">
				</div>
				<h1>Widgets included.</h1>
			</section>
		</section>
        {% include footer.html %}
	</body>
</html>
